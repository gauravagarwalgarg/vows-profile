name: Build and Deploy MkDocs & Biodata Generator
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build MkDocs to docs subdirectory
        run: mkdocs build -d _site/docs

      - name: Copy Generator Application to site root
        run: |
          cp index.html _site/
          cp Biodata.html _site/ 2>/dev/null || true
          cp support.html _site/
          cp app.js _site/
          cp app.css _site/
          cp style.css _site/
          cp -r metadata/ _site/
          cp -r vendor/ _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
